# ============================================================
# Multi-Modal ASD Detection — Configuration
# ============================================================

random_seed: 42
device: "auto"  # auto | cpu | cuda | mps

# ---- Paths ----
paths:
  dataset3: "data/dataset_3_clinical_tabular/asd.csv"
  dataset2_raw: "data/dataset_2_eye_tracking/archive-2/Eye-tracking Output"
  dataset2_metadata: "data/dataset_2_eye_tracking/archive-2/Metadata_Participants.csv"
  dataset2_processed: "data/processed/dataset_2"
  results: "results"
  checkpoints: "results/checkpoints"
  metrics: "results/metrics"
  confusion_matrices: "results/confusion_matrices"
  plots: "results/plots"
  preprocessing_artifacts: "results/preprocessing_artifacts"

# ---- Dataset 3 ----
dataset3:
  target_column: "Diagnosed_ASD"
  id_column: "Child_ID"
  drop_columns:
    - "Unnamed: 10"
    - "Child_ID"
  numerical_features:
    - "Age"
    - "Social_Interaction_Score"
    - "Communication_Score"
    - "Repetitive_Behavior_Score"
  categorical_features:
    - "Gender"
    - "Jaundice"
    - "Family_ASD_History"
    - "Language_Delay"
  categorical_mappings:
    Gender:
      Male: 1
      Female: 0
    Jaundice:
      "Yes": 1
      "No": 0
    Family_ASD_History:
      "Yes": 1
      "No": 0
    Language_Delay:
      "Yes": 1
      "No": 0
  target_mapping:
    "Yes": 1
    "No": 0
  test_size: 0.15
  val_size: 0.15   # fraction of remaining after test split

# ---- KAN (Dataset 3 Primary) ----
kan:
  hidden_layers: [64, 32]
  grid_size: 5
  spline_order: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  batch_size: 64
  early_stopping_patience: 15
  dropout: 0.1

# ---- TabNet (Dataset 3 Benchmark) ----
tabnet:
  n_d: 16            # width of decision prediction layer
  n_a: 16            # width of attention embedding
  n_steps: 3         # number of sequential attention steps
  gamma: 1.3         # coefficient for feature reusage in attention
  lambda_sparse: 0.001  # sparsity regularization
  learning_rate: 0.02
  weight_decay: 0.0001
  epochs: 100
  batch_size: 256
  virtual_batch_size: 128
  early_stopping_patience: 15
  momentum: 0.02
  mask_type: "sparsemax"  # sparsemax | entmax

# ---- Dataset 2 (Eye Tracking) ----
dataset2:
  raw_dir: "data/dataset_2_eye_tracking/archive-2/Eye-tracking Output"
  metadata_path: "data/dataset_2_eye_tracking/archive-2/Metadata_Participants.csv"
  processed_dir: "data/processed/dataset_2"
  sequence_length: 200
  stride: 100
  min_sequence_length: 50
  test_size: 0.15
  val_size: 0.15
  features:
    - "Point of Regard Right X [px]"
    - "Point of Regard Right Y [px]"
    - "Point of Regard Left X [px]"
    - "Point of Regard Left Y [px]"
    - "Pupil Diameter Right [mm]"
    - "Pupil Diameter Left [mm]"
    - "Gaze_Velocity"
    - "Fixation_Flag"
  batch_size: 32

# ---- Mamba (Dataset 2 Primary) ----
mamba:
  d_model: 64
  d_state: 16
  d_conv: 4
  expand: 2
  n_layers: 2
  dropout: 0.1
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 15
  batch_size: 64
  early_stopping_patience: 5

# ---- PatchTST (Dataset 2 Benchmark) ----
patchtst:
  patch_len: 16
  stride: 8
  d_model: 64
  n_heads: 4
  d_ff: 128
  n_layers: 2
  dropout: 0.1
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 15
  batch_size: 64
  early_stopping_patience: 5

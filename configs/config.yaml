# ============================================================
# Multi-Modal ASD Detection — Configuration
# ============================================================

random_seed: 42
device: "auto"  # auto | cpu | cuda | mps

# ---- Paths ----
paths:
  dataset3: "../Datasets/3rd Dataset_Early Autism Screening Dataset for Toddlers/Toddler Autism dataset July 2018.csv"
  dataset2_raw: "../Datasets/2nd_dataset/Eye-tracking Output"
  dataset2_metadata: "../Datasets/2nd_dataset/Metadata_Participants.csv"
  dataset2_processed: "data/processed/dataset_2"
  results: "results"
  checkpoints: "results/checkpoints"
  metrics: "results/metrics"
  confusion_matrices: "results/confusion_matrices"
  plots: "results/plots"
  preprocessing_artifacts: "results/preprocessing_artifacts"

# ---- Dataset 3 (Q-CHAT-10 Toddler Screening) ----
dataset3:
  target_column: "Class/ASD Traits"
  id_column: "Case_No"
  drop_columns:
    - "Case_No"
    - "Qchat-10-Score"
  numerical_features:
    - "Age_Mons"
  categorical_features:
    - "A1"
    - "A2"
    - "A3"
    - "A4"
    - "A5"
    - "A6"
    - "A7"
    - "A8"
    - "A9"
    - "A10"
    - "Sex"
    - "Jaundice"
    - "Family_mem_with_ASD"
    - "Ethnicity"
    - "Who completed the test"
  categorical_mappings:
    Sex:
      m: 1
      f: 0
    Jaundice:
      "yes": 1
      "no": 0
    Family_mem_with_ASD:
      "yes": 1
      "no": 0
  label_encode_features:
    - "Ethnicity"
    - "Who completed the test"
  target_mapping:
    "Yes": 1
    "No": 0
  test_size: 0.15
  val_size: 0.15

# ---- KAN (Dataset 3 Primary) ----
kan:
  hidden_layers: [64, 32]
  grid_size: 5
  spline_order: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  batch_size: 64
  early_stopping_patience: 15
  dropout: 0.1

# ---- TabNet (Dataset 3 Benchmark) ----
tabnet:
  n_d: 16            # width of decision prediction layer
  n_a: 16            # width of attention embedding
  n_steps: 3         # number of sequential attention steps
  gamma: 1.3         # coefficient for feature reusage in attention
  lambda_sparse: 0.001  # sparsity regularization
  learning_rate: 0.02
  weight_decay: 0.0001
  epochs: 100
  batch_size: 256
  virtual_batch_size: 128
  early_stopping_patience: 15
  momentum: 0.02
  mask_type: "sparsemax"  # sparsemax | entmax

# ---- Dataset 2 (Eye Tracking) ----
dataset2:
  raw_dir: "../Datasets/2nd_dataset/Eye-tracking Output"
  metadata_path: "../Datasets/2nd_dataset/Metadata_Participants.csv"
  processed_dir: "data/processed/dataset_2"
  sequence_length: 200
  stride: 100
  min_sequence_length: 50
  test_size: 0.15
  val_size: 0.15
  features:
    - "Point of Regard Right X [px]"
    - "Point of Regard Right Y [px]"
    - "Point of Regard Left X [px]"
    - "Point of Regard Left Y [px]"
    - "Pupil Diameter Right [mm]"
    - "Pupil Diameter Left [mm]"
    - "Gaze_Velocity"
    - "Fixation_Flag"
  batch_size: 32

# ---- Mamba (Dataset 2 Primary) ----
mamba:
  d_model: 64
  d_state: 16
  d_conv: 4
  expand: 2
  n_layers: 2
  dropout: 0.1
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 15
  batch_size: 64
  early_stopping_patience: 5

# ---- PatchTST (Dataset 2 Benchmark) ----
patchtst:
  patch_len: 16
  stride: 8
  d_model: 64
  n_heads: 4
  d_ff: 128
  n_layers: 2
  dropout: 0.1
  learning_rate: 0.0005
  weight_decay: 0.0001
  epochs: 15
  batch_size: 64
  early_stopping_patience: 5
